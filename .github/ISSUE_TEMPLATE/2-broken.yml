name: 🔗 Report a broken or wrong link
description: Something is outdated, broken or incorrect
title: "[Fix] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: Page or section, and the link text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong, and what's the correct version?
    validations:
      required: true
