name: ✨ Suggest a field or journal
description: Add something useful to Science-Research-Radar
title: "[Suggest] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make this better! Suggestions are reviewed by the maintainer before anything is added.
  - type: input
    id: name
    attributes:
      label: What should be added?
      placeholder: Name of the field or journal
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Official link
      placeholder: https://
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: One or two lines for other readers.
    validations:
      required: true
